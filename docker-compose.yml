# Local dev Redis with an Upstash-compatible REST API (no account needed).
# docker compose up -d, then:
#   UPSTASH_REDIS_REST_URL=http://localhost:8079 UPSTASH_REDIS_REST_TOKEN=local npm run test
services:
  redis:
    image: redis:7.4-alpine
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
